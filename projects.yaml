    description: Task-aware agent-driven prompt optimization using self-evolving critique and synthesis (Microsoft).
    tagline: Agent-driven self-evolving prompt optimization
    tags: [automl, llm, microsoft, prompt-engineering, prompt-optimization, python]
  - name: TextGrad
    repo: zou-group/textgrad
    description: Automatic differentiation via text feedback, enabling gradient-like optimization of compound AI systems (Nature 2024).
    tagline: Gradient-like optimization of AI via text feedback
    note: GEPA and DSPy carry this line of work forward.
    tags: [ai-optimization, compound-systems, large-language-models, prompt-optimization, textual-gradients]
    lifecycle: historical
  - name: GEPA
    repo: gepa-ai/gepa
