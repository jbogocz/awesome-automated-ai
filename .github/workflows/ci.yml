name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      # projects.yaml is the curated source of truth but was never checked on
      # a PR, so a malformed entry could merge and only surface at the next
      # unattended regeneration.
      - name: Validate projects.yaml
        run: pnpm run validate

      # Generation only ever ran in the unattended weekly job, so a change
      # that broke the README or dashboard build merged green and surfaced at
      # 06:00 on Monday. --no-fetch renders from the committed data/: no network,
      # no token. The rewritten files are discarded with the runner.
      - name: Generate README from the committed data
        run: pnpm run generate --no-fetch

      - name: Generate dashboard data from the committed data
        run: pnpm run site-data
