name: Weekly Regenerate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate README with fresh API data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run generate

      - name: Regenerate dashboard data
        run: pnpm run site-data

      - name: Bump version to today's date
        run: pnpm run bump-version

      - name: Commit and push changes
        id: commit
        env:
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          BOT_NAME: github-actions[bot]
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add README.md docs/data.json package.json data/curator.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: weekly regeneration [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish weekly release
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag the commit this run actually produced. Without --target the
          # tag lands on whatever the default branch happens to point at when
          # the release is cut, which need not be the commit above.
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --generate-notes
          fi

  # Releases created with GITHUB_TOKEN never fire pages.yml's `on: release`
  # trigger (GitHub blocks workflow chaining off GITHUB_TOKEN events), so the
  # weekly pipeline deploys Pages itself. pages.yml remains for manual deploys.
  deploy-pages:
    needs: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # regenerate just pushed a new commit; github.sha predates it

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - id: deployment
        uses: actions/deploy-pages@v5
