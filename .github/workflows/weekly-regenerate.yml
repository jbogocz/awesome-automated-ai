name: Weekly Regenerate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write # the drift report files an issue; without this gh exits 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate README with fresh API data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run generate

      - name: Regenerate dashboard data
        run: pnpm run site-data

      - name: Bump version to today's date
        run: pnpm run bump-version

      - name: Commit and push changes
        id: commit
        env:
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          BOT_NAME: github-actions[bot]
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add README.md docs/data.json package.json data/curator.db
          # Not a "nothing to do" case: a successful run always records a new
          # measured snapshot per listed project, so an empty diff means the
          # regeneration produced nothing and must not be reported as success.
          if git diff --cached --quiet; then
            echo "::error::regeneration staged no changes - no measurement was recorded this run"
            exit 1
          fi
          git commit -m "chore: weekly regeneration [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Everything below reports; nothing below can fail the run. The
      # regeneration refreshes metadata but never adds, retires or re-slugs an
      # entry, so drift accumulated silently until someone went looking.
      # Both reporters write findings to stdout and diagnostics to stderr, so
      # the report body stays free of log noise and "report is non-empty"
      # genuinely means "something drifted".
      - name: Audit catalog drift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run audit >> audit-report.md || true

      - name: Check links the metadata fetch never touches
        continue-on-error: true
        run: pnpm run check-links >> audit-report.md || true

      - name: Decide whether anything drifted
        id: audit
        run: |
          if [ -s audit-report.md ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the drift tracking issue
        if: steps.audit.outputs.drift == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Catalog drift"
        run: |
          # One long-lived issue, updated in place, so the weekly job never
          # accumulates a pile of near-identical reports.
          # --state all, so a closed issue is reopened rather than duplicated.
          NUM=$(gh issue list --state all --search "$TITLE in:title" --json number,title,state \
                  --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file audit-report.md
            gh issue reopen "$NUM" 2>/dev/null || true
            echo "Updated issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file audit-report.md
          fi

      - name: Publish weekly release
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag the commit this run actually produced. Without --target the
          # tag lands on whatever the default branch happens to point at when
          # the release is cut, which need not be the commit above.
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --generate-notes
          fi

  # Releases created with GITHUB_TOKEN never fire pages.yml's `on: release`
  # trigger (GitHub blocks workflow chaining off GITHUB_TOKEN events), so the
  # weekly pipeline deploys Pages itself. pages.yml remains for manual deploys.
  deploy-pages:
    needs: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # regenerate just pushed a new commit; github.sha predates it

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - id: deployment
        uses: actions/deploy-pages@v5
