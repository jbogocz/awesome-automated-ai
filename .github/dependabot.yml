version: 2

# Dependency currency used to depend on someone remembering to check. It is a
# scheduled job's business, not a person's.
#
# Note on timing: pnpm enforces a minimum release age, so a package published
# in the last few hours fails `pnpm install --frozen-lockfile` even when the
# lockfile is internally consistent. Running well after the weekly regenerate
# keeps a fresh Dependabot bump from breaking Monday's unattended run.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR for the toolchain; these move together and are covered by CI.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node type definitions track the runtime, never the newest release. CI
      # and the weekly job both run Node 24 (Active LTS), so 26.x types would
      # typecheck calls against APIs the runtime does not have - a green build
      # that fails at 06:00 on Monday. Lift this together with node-version in
      # the workflows, not before.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
